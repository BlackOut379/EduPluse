
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | EduPluse</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <main class="login-page">

        <section class="login-brand">
            <div class="logo">Edu<span>Pluse</span></div>

            <h1>
                Start your journey.<br>
                <span>Make progress.</span>
            </h1>

            <p>
                Create your EduPluse account and connect learning,
                performance, and academic insights in one place.
            </p>
        </section>

        <section class="login-form-area">
            <div class="login-card">

                <div class="tag">NEW ACCOUNT</div>

                <h2>Create account.</h2>

                <p class="login-subtitle">
                    Enter your details to get started.
                </p>

                <form method="POST">

                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name"
                           placeholder="Enter your full name" required>

                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email"
                           placeholder="you@example.com" required>

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="Create a password"
                           minlength="8" required>

                    <label for="role">Account Type</label>
                    <select id="role" name="role" required>
                        <option value="">Select account type</option>
                        <option value="student">Student</option>
                        <option value="teacher">Teacher</option>
                    </select>

                    <button type="submit">Create Account →</button>

                </form>

                <p class="login-note">
                    Already have an account?
                    <a href="{{ url_for('home') }}">Back to homepage</a>
                </p>

                <p class="login-note">
                    Secure academic access · EduPluse
                </p>

            </div>
        </section>

    </main>

</body>
</html>
